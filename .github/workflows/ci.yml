name: ci

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: perturb --selftest (41 discrimination cases)
        run: python3 perturb --selftest

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install perturb + pytest
        run: pip install . pytest jsonschema
      - name: determinism guard (.pyc-staleness regression)
        run: python3 -m pytest tests/ -q
      - name: self-hosting mutation test (informational artifact)
        run: python3 perturb perturb_cli.py --lang python --test 'python3 perturb --selftest' --n 12
